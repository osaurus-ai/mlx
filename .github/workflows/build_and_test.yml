name: Core16 diagnostic non-Metal mmap
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  named-mmap-nonmetal:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attest exact production source
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          base=5fe78112adfc4365a21d187400fbfe96a1bed427
          test "$(git diff --name-only "$base" HEAD)" = '.github/workflows/build_and_test.yml'
          git diff --exit-code "$base" HEAD -- mlx tests CMakeLists.txt cmake
          git rev-parse HEAD > evidence/workflow-commit.txt
          printf '%s\n' "$base" > evidence/production-core-commit.txt
          git ls-files -z | xargs -0 sha256sum > evidence/source-sha256.txt
          uname -a > evidence/host.txt
      - name: CPU dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential libblas-dev liblapacke-dev libopenblas-dev cmake ninja-build clang git
      - name: Build exact core CPU tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMLX_BUILD_METAL=OFF -DMLX_BUILD_CUDA=OFF -DMLX_BUILD_CPU=ON -DMLX_BUILD_TESTS=ON -DMLX_BUILD_EXAMPLES=OFF -DMLX_BUILD_BENCHMARKS=OFF -DMLX_BUILD_PYTHON_BINDINGS=OFF 2>&1 | tee evidence/configure.log
          cmake --build build --target tests --parallel 2 2>&1 | tee evidence/build.log
          cp build/CMakeCache.txt evidence/
          sha256sum build/tests/tests .github/workflows/build_and_test.yml > evidence/binary-workflow-sha256.txt
          ldd build/tests/tests > evidence/linked-libraries.txt
          find build -type f \( -name 'libmlx*' -o -name '*metallib' \) -exec sha256sum {} + > evidence/compiled-library-sha256.txt
          git -C build/_deps/doctest-src rev-parse HEAD > evidence/doctest-commit.txt
      - name: Run three actual non-Metal contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'MLX_BUILD_METAL:BOOL=OFF' build/CMakeCache.txt
          grep -Fx 'MLX_BUILD_CUDA:BOOL=OFF' build/CMakeCache.txt
          DEVICE=cpu timeout 120 build/tests/tests --test-case='named mmap banks register expert ranges and release weak owners,named mmap rejects invalid contract before registering,unnamed mmap regions retain their unregistered behavior' --reporters=xml --out=evidence/named-mmap.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as E, json
          from pathlib import Path
          root=E.parse('evidence/named-mmap.xml').getroot()
          cases=root.findall('.//TestCase')
          expected={'named mmap banks register expert ranges and release weak owners','named mmap rejects invalid contract before registering','unnamed mmap regions retain their unregistered behavior'}
          assert len(cases)==3 and {c.get('name') for c in cases}==expected
          for case in cases:
              assert case.get('skipped','false')=='false', E.tostring(case)
              assert not case.findall('.//Exception'), E.tostring(case)
              result=case.find('OverallResultsAsserts')
              assert result is not None and int(result.get('failures','-1'))==0, E.tostring(case)
          total=root.find('OverallResultsTestCases')
          assert total is not None and int(total.get('successes','-1'))==3 and int(total.get('failures','-1'))==0
          Path('evidence/result.json').write_text(json.dumps({'status':'PASS','backend':'CPU/non-Metal','selected_cases':sorted(expected),'executed':3,'selected_skips':0,'metal_proof':False},indent=2))
          PY
          sha256sum -c evidence/source-sha256.txt >/dev/null
          sha256sum -c evidence/binary-workflow-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core16-nonmetal-evidence
          path: evidence/
          if-no-files-found: error
